<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Circuit Tech Lines Background -->
  <path d="M 80,250 H 180 L 220,290 H 280 L 320,250 H 420" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
  <path d="M 120,150 H 200 L 250,200 L 300,150 H 380" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.3"/>
  <circle cx="180" cy="250" r="4" fill="#94a3b8" />
  <circle cx="320" cy="250" r="4" fill="#94a3b8" />
  <circle cx="250" cy="200" r="4" fill="#cbd5e1" />

  <!-- Outer Tech Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="20 10 5 10" opacity="0.8" />
  <circle cx="250" cy="250" r="195" fill="url(#avatarGrad)" stroke="#64748b" stroke-width="2" />

  <!-- Head & Body Silhouette -->
  <g fill="#cbd5e1" filter="url(#glow)">
    <!-- Head -->
    <circle cx="250" cy="180" r="65" fill="#e2e8f0" />
    <!-- Hair / Tech Cap Concept -->
    <path d="M 185,170 Q 250,110 315,170 Q 290,140 250,140 Q 210,140 185,170 Z" fill="#334155" />
    <!-- Glasses -->
    <rect x="200" y="170" width="40" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
    <rect x="260" y="170" width="40" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
    <line x1="240" y1="183" x2="260" y2="183" stroke="#0f172a" stroke-width="4" />
    
    <!-- Body & Suit/Shirt -->
    <path d="M 130,380 C 130,300 175,270 250,270 C 325,270 370,300 370,380 Z" fill="#cbd5e1" />
    <path d="M 210,270 L 250,330 L 290,270 Z" fill="#475569" />
    <path d="M 235,300 L 250,380 L 265,300 Z" fill="#1e293b" />
  </g>

  <!-- Badge Emblem -->
  <g transform="translate(330, 320)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <text x="55" y="23" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RUTS CK</text>
  </g>
</svg>
