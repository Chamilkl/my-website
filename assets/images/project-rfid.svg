<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a" />
  
  <!-- Door Panel Background -->
  <rect x="150" y="50" width="300" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- Access Control Unit -->
  <rect x="220" y="80" width="160" height="240" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="3" />
  
  <!-- Screen Display -->
  <rect x="240" y="105" width="120" height="50" rx="4" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
  <text x="300" y="128" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ACCESS GRANTED</text>
  <text x="300" y="144" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Chamil Kalong</text>

  <!-- Keypad / RFID Scanner Zone -->
  <rect x="250" y="175" width="100" height="90" rx="8" fill="#334155" />
  <path d="M 270,220 C 270,200 330,200 330,220" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-dasharray="4 4" />
  <circle cx="300" cy="220" r="8" fill="#cbd5e1" />

  <!-- RFID Card Graphic Floating -->
  <g transform="translate(360, 200) rotate(-15)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />
    <rect x="12" y="15" width="25" height="20" rx="3" fill="#64748b" />
    <text x="55" y="55" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">RUTS RFID</text>
  </g>
</svg>
