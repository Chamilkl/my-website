<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a" />
  
  <!-- Topology Lines -->
  <line x1="300" y1="120" x2="150" y2="240" stroke="#64748b" stroke-width="3" />
  <line x1="300" y1="120" x2="300" y2="240" stroke="#64748b" stroke-width="3" />
  <line x1="300" y1="120" x2="450" y2="240" stroke="#64748b" stroke-width="3" />
  <line x1="150" y1="240" x2="450" y2="240" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Core Router Node -->
  <circle cx="300" cy="120" r="45" fill="#1e293b" stroke="#cbd5e1" stroke-width="4" />
  <text x="300" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Core Router</text>

  <!-- Switch Nodes -->
  <rect x="110" y="215" width="80" height="50" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <text x="150" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">VLAN 10</text>

  <rect x="260" y="215" width="80" height="50" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <text x="300" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">VLAN 20</text>

  <rect x="410" y="215" width="80" height="50" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <text x="450" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">VLAN 30</text>

  <!-- Bottom PC Endpoints -->
  <rect x="130" y="310" width="40" height="30" rx="4" fill="#475569" />
  <rect x="280" y="310" width="40" height="30" rx="4" fill="#475569" />
  <rect x="430" y="310" width="40" height="30" rx="4" fill="#475569" />
  <line x1="150" y1="265" x2="150" y2="310" stroke="#64748b" stroke-width="2" />
  <line x1="300" y1="265" x2="300" y2="310" stroke="#64748b" stroke-width="2" />
  <line x1="450" y1="265" x2="450" y2="310" stroke="#64748b" stroke-width="2" />

  <text x="300" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cisco Packet Tracer Architecture</text>
</svg>
