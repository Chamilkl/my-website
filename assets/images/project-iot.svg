<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a" />
  <grid width="600" height="400" />
  <!-- Circuit Background Lines -->
  <path d="M 50,100 H 200 L 250,150 H 400 L 450,100 H 550" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="5 5" />
  <path d="M 100,300 H 250 L 300,250 H 500" stroke="#334155" stroke-width="2" fill="none" />
  
  <!-- Central Microcontroller Board -->
  <rect x="200" y="120" width="200" height="160" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="3" />
  <rect x="230" y="150" width="140" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="300" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ESP32 IoT</text>

  <!-- Connection Pins -->
  <circle cx="210" cy="140" r="4" fill="#94a3b8" />
  <circle cx="210" cy="160" r="4" fill="#94a3b8" />
  <circle cx="210" cy="180" r="4" fill="#94a3b8" />
  <circle cx="210" cy="200" r="4" fill="#94a3b8" />
  <circle cx="390" cy="140" r="4" fill="#94a3b8" />
  <circle cx="390" cy="160" r="4" fill="#94a3b8" />
  <circle cx="390" cy="180" r="4" fill="#94a3b8" />
  <circle cx="390" cy="200" r="4" fill="#94a3b8" />

  <!-- Wireless Signals -->
  <path d="M 280,90 A 30 30 0 0 1 320,90" fill="none" stroke="#cbd5e1" stroke-width="3" />
  <path d="M 270,75 A 45 45 0 0 1 330,75" fill="none" stroke="#94a3b8" stroke-width="3" />
  <path d="M 260,60 A 60 60 0 0 1 340,60" fill="none" stroke="#64748b" stroke-width="3" />

  <!-- Status Cards -->
  <rect x="60" y="240" width="110" height="60" rx="8" fill="#334155" />
  <text x="115" y="268" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Sensor Data</text>
  <text x="115" y="288" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">24.5 °C</text>

  <rect x="430" y="240" width="110" height="60" rx="8" fill="#334155" />
  <text x="485" y="268" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Power Output</text>
  <text x="485" y="288" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">220V MQTT</text>
</svg>
